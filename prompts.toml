# Images generated with FLUX.1-schnell (Apache 2.0), for posters that need a
# person, a couple or a superhero: free photos of real people come without
# their consent to advertising, and nobody here exists.
#
# ai.py makes four candidates per entry; the chosen one gets "seed", and
# "ai.py pin" adds it to sources.toml. Without "prompt", the prompt is made
# from the title's plot and genres in catalog.toml. The text on the posters is
# set by demo.py, never by the model.
#
# shape: poster (2:3) or backdrop (16:9).

[style]
photo = "cinematic film still, photorealistic, 35mm film, natural skin texture, soft dramatic lighting, shallow depth of field, rich colour grading, no text, no letters, no logo, no watermark"
poster = "vertical movie poster artwork, subject in the upper two thirds, calm empty space at the bottom"

# ---- Vanguard, the superhero series

[image.ai-vanguard-poster]
title = "Vanguard"
shape = "poster"
seed = 2
prompt = "a woman in her thirties in a dark grey armoured superhero suit of original design with a small plain steel-blue triangle on the chest, no cape, standing on the girders of an unfinished suspension bridge at dusk, bent steel beams floating around her, city skyline behind"

[image.ai-vanguard-backdrop]
title = "Vanguard"
shape = "backdrop"
seed = 2
prompt = "wide shot of a superhero in a dark grey armoured suit hovering above a half-built suspension bridge over a river at dusk, steel beams bending in the air, city lights in the distance"

[image.ai-vanguard-fallout-poster]
title = "Vanguard: Fallout"
shape = "poster"
seed = 4
prompt = "a woman superhero in a scratched dark grey armoured suit facing a masked villain in a long black coat on a rain-soaked rooftop at night, neon city below, sparks in the rain"

[image.ai-vanguard-last-stand-poster]
title = "Vanguard: Last Stand"
shape = "poster"
seed = 3
prompt = "four superheroes in battle-worn suits standing side by side in a ruined factory hall, a giant dormant machine glowing red behind them, dust in shafts of light"

[image.ai-vanguard-legacy-poster]
title = "Vanguard: Legacy"
shape = "poster"
seed = 2
prompt = "three teenagers in hoodies discovering an abandoned superhero headquarters, old armoured suits in glass cases, flashlight beams, dust, a faded plain steel-blue triangle painted on the wall"

[image.ai-vanguard-legacy-backdrop]
title = "Vanguard: Legacy"
shape = "backdrop"
seed = 2
prompt = "wide shot of an abandoned superhero headquarters hidden under a city, rows of empty armoured suits in glass cases, three teenagers with flashlights in the doorway"

