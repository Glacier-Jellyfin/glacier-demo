# Images generated with FLUX.1-schnell (Apache 2.0), for posters that need a
# person, a couple or a superhero: free photos of real people come without
# their consent to advertising, and nobody here exists.
#
# ai.py makes four candidates per entry; the chosen one gets "seed", and
# "ai.py pin" adds it to sources.toml. Without "prompt", the prompt is made
# from the title's plot and genres in catalog.toml. The text on the posters is
# set by demo.py, never by the model.
#
# shape: poster (2:3) or backdrop (16:9). crop cuts that share off the bottom
# of the chosen image, for a candidate that is good apart from lettering there.

# The prompt is: shape, art direction, scene, composition (posters), medium.
# The shape comes first so that CLIP, which reads only 77 tokens, sees it:
# "textless key art" is what poster artwork without lettering is called.
[style]
poster = "textless theatrical one-sheet movie poster key art"
backdrop = "textless widescreen movie key art, horizontal banner"
composition = "bold central composition, the subject in the upper two thirds, the lower third plain dark empty ground fading to black"

# Art direction by genre: the first entry here that the title has wins.
[art]
superhero = "epic low-angle hero shot, volumetric light, sparks and debris in the air, dramatic sky, teal and orange grade"
medical = "cold fluorescent and blue emergency light, deep corridor perspective, tense and tired"
crime = "noir mood, wet surfaces, sodium street light, cold blue and amber"
thriller = "high contrast chiaroscuro, a single hard light source, deep shadows, cold desaturated palette"
mystery = "fog, muted greens and greys, eerie stillness"
romance = "golden hour backlight, warm glow, gentle lens flare, soft focus background"
music = "moody stage light, haze, a warm spotlight cutting through darkness"
comedy = "bright cheerful light, warm saturated colours, playful expressions"
family = "warm storybook light, rich colours, wonder"
drama = "intimate portrait, soft window light, muted natural palette, quiet emotion"

# How the picture is made. An entry's "medium" wins; otherwise Anime, then
# Animation with Kids (cartoon), then Animation, then photo.
[medium]
photo = "professional cinema poster photography, photorealistic, detailed faces and natural hands, subtle film grain, cinematic colour grade, no text, no watermark"
animation = "stylised 3D animated feature film still, soft global illumination, expressive characters with big eyes, rich textures, warm cinematic lighting, no text, no watermark"
anime = "Japanese anime key visual, cel shading, clean confident line art, vibrant hand-painted background, dramatic sky, no text, no watermark"
cartoon = "2D cartoon for children's television, bold clean outlines, flat bright colours, simple shapes, friendly characters, no text, no watermark"

