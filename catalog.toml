year = 2012
runtime = 12
genres = ["Science Fiction", "Short"]
studios = ["Blender Foundation"]
countries = ["Netherlands"]
collection = "Blender Open Movies"
plot = """
In a future Amsterdam, a group of scientists and warriors make a last stand
against the robots, and try to fix a breakup from years ago.
Shot in Amsterdam with real actors and a lot of visual effects, by a small team in a few months.
A thoughtful science fiction story about what it means to be human.
"""
directors = ["Ian Hubert"]
poster = "tears-of-steel"
focus = 0.5
backdrop = "tears-of-steel"
style = "display"
accent = "#9cc9e8"
[movie.film]
source = "tos"
audio = [
  { source = "tos-surround", lang = "eng", title = "English 5.1", default = true, original = true },
  { index = 0, lang = "eng", title = "English Stereo" },
]
subtitles = [
  { source = "tos-sub-en", lang = "eng", title = "English" }, { source = "tos-sub-de", lang = "ger", title = "Deutsch" },
  { source = "tos-sub-fr-orig", lang = "fre", title = "Français" }, { source = "tos-sub-es", lang = "spa", title = "Español" },
  { source = "tos-sub-it", lang = "ita", title = "Italiano" }, { source = "tos-sub-nl", lang = "dut", title = "Nederlands" },
  { source = "tos-sub-pt-br", lang = "por", title = "Português (Brasil)" },
  { source = "tos-sub-ru", lang = "rus", title = "Русский" },
  { source = "tos-sub-jp", lang = "jpn", title = "日本語" }, { source = "tos-sub-he", lang = "heb", title = "עברית" },
]
chapters = [[0, "Amsterdam"], [64, "Intro"], [72, "The Last Stand"], [300, "Celia"], [655, "Credits"], [708, "After the Credits"]]

[[movie]]
title = "Cosmos Laundromat"
year = 2015
runtime = 12
genres = ["Animation", "Short", "Fantasy"]
studios = ["Blender Foundation"]
countries = ["Netherlands"]
collection = "Blender Open Movies"
plot = """
On a desolate island, a sheep who has had enough of life meets a salesman
who offers him every life there is.
But every new life comes with a price, and the salesman is not who he seems.
Funny, colourful and full of heart, for viewers of every age.
"""
directors = ["Mathieu Auvray"]
