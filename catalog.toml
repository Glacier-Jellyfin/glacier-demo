# What each collection says about itself.
[collection_overviews]
"Northern Light Trilogy" = """
Three stories from the far north, about the people who stay when everyone
else leaves. A lighthouse that will not go dark, a glacier that is breaking
apart and a summer that lasts only twenty minutes a day. Each film stands
alone, but the same islands and faces keep coming back.
"""
"Paper Moons Collection" = """
Juno and her grumpy cat Mister Pepper fold moons out of paper and send them
into the night sky. Two animated adventures across the fjords, full of
lighthouses, paper cranes and a moon that only wants a friend. For everyone
who has ever wished on something they made themselves.
"""
"Animal Tales" = """
A fox and a sheepdog snowed in on the same farm, and six close looks at the
animals that live right outside our doors. An animated adventure and a nature
series about curiosity, patience and the small worlds we usually walk past.
"""
"Blender Open Movies" = """
Short films made by Blender Studio in Amsterdam with free and open source
software, and released under a Creative Commons licence. From a very large
rabbit to a lonely sheep and a forest full of mushroom folk, every film was
also a test bed for new tools that later went into Blender.
"""
"Vanguard Collection" = """
A bridge engineer who can bend steel with her mind, a team that never asked
to be heroes, and a city that keeps needing them. Three films and a new series
follow the Vanguard from their first rescue to the machine that made them.
"""

