[[movie]]
title = "Sprite Fright"
year = 2021
runtime = 11
genres = ["Animation", "Short", "Comedy", "Horror"]
studios = ["Blender Studio"]
countries = ["Netherlands"]
collection = "Blender Open Movies"
plot = """
A group of teenagers on a trip to the woods meet the small mushroom folk
who live there, and the folk do not like litter.
What starts as a party in the forest soon turns into a fight for survival. A horror comedy for all ages.
Quiet, eerie and very hard to forget.
"""
directors = ["Matthew Luhn", "Hjalti Hjálmarsson"]
poster = "sprite-fright-poster"
plain_poster = true
backdrop = "sprite-fright-forest"
style = "display"
files = [{ video = "1080p", tracks = "open-movie" }]

# ---- The bulk of the film library
#
# Enough films that the library scrolls and the A-Z rail has letters with
# many titles, letters with one and a letter with none (X); a row of posters
# should span one or two letters, not seven. Each film is one line:
# [title, year, runtime, rating, genres, image, focus, plot].
# demo.py adds studio, director, cast, poster font and colour, and cuts the
# video from a shared three-hour master, so a film costs about a second.
# A table [[movie]] with the same title would override the line.

[fillers]
films = [
  ["7 Days in Lisbon", 2017, 96, "FSK-6", "Romance/Comedy", "lisbon-rain", 0.7, "A translator stuck in Lisbon for a week agrees to show a stranger the city, one day at a time. Day by day they get closer, and the city keeps throwing surprises at them. On the seventh day, the ferry is finally running again. A warm and funny film about people who are a little lost."],
  ["1000 Lanterns", 2021, 109, "FSK-12", "Drama", "lanterns", 0.3, "A lantern maker's daughter has one festival to save the family workshop. Her father is ill, the orders have stopped, and a big company wants the building. She has one night to show what the old workshop can do. A quiet, moving drama about the people we leave behind and the ones who wait for us."],
  ["21 Winters", 2014, 128, "FSK-12", "Drama", "snowy-forest", 0.3, "Twenty-one winters in the life of a forester and the valley he never leaves. We see him fall in love, lose a brother, plant a forest and grow old. A quiet film about time and the places that shape us. A drama told with great warmth and a lot of patience."],
  ["Above the Tide", 2019, 101, "FSK-6", "Drama/Sport", "surfer", 0.5, "A surfer recovering from an injury trains for one last big-wave contest. Her coach has given up on her, and her body is not what it was. But the ocean does not care about any of that. Sweat, friendship and a few small miracles."],
  ["After the Rain", 2016, 94, "FSK-12", "Drama", "rain-window", 0.5, "Two strangers share a taxi in a downpour and keep missing each other afterwards. Every time they almost meet again, something gets in the way. A romantic comedy about timing, umbrellas and bad luck. A drama told with great warmth and a lot of patience."],
  ["Aurora", 2023, 118, "FSK-12", "Science Fiction", "aurora", 0.5, "When the northern lights stop moving, a research station on Lofoten is the first to notice. Then the satellites go dark one by one. Two scientists and a fisherman are the only ones who understand what is coming. A thoughtful science fiction story about what it means to be human."],
  ["Ashes of Summer", 2012, 112, "FSK-16", "Thriller", "volcano", 0.4, "A geologist on a volcanic island finds out the evacuation was never meant to include her. With the ash falling and the boats gone, she has to cross the island on foot. The only person who can help her is the man she reported to the police. Gripping, clever and full of twists you will not see coming."],
  ["Atlas of Small Things", 2020, 88, "FSK-0", "Documentary", "library-books", 0.6, "A tour of the world's oddest museums, from buttons to bus tickets. Each museum has a keeper with a story. Together they make a funny and moving portrait of people who cannot throw anything away. A beautifully filmed documentary that changes how you see the world."],
  ["Blue Hour", 2018, 99, "FSK-12", "Drama", "bridge-fog", 0.3, "A night nurse and a baker meet every morning on the same bridge, at the same minute. They never speak, but they start leaving notes. When one morning she does not come, he sets out to find her. A drama told with great warmth and a lot of patience."],
  ["Brass and Bone", 2015, 121, "FSK-16", "Crime", "abandoned-building", 0.6, "A detective returns to the factory town she left and the case that made her leave. The factory is closed, but the families still run the town. Every door she knocks on leads back to the night her sister disappeared. A dark and stylish crime story about loyalty, guilt and the price of the truth."],
  ["Broken Compass", 2022, 107, "FSK-12", "Adventure", "desert-dunes", 0.5, "Two brothers cross the desert with their late father's map and a compass that points the wrong way. They have not spoken in years. Out in the sand, with water running low, they have no choice but to talk. An honest and touching film about family, loss and hope."],
  ["Bazaar", 2019, 93, "FSK-12", "Thriller", "crowded-market", 0.4, "One night in the night market, a stolen phone and twelve people who want it back. Each of them has a reason to want it, and only one of them knows what is on it. By dawn, the market will look very different. A tense thriller that keeps you guessing until the very last minute."],
  ["Before the Whistle", 2021, 104, "FSK-6", "Sport/Drama", "marathon-runners", 0.4, "A retired runner coaches a team of amateurs for the city marathon. His runners include a baker, a bus driver and a teenager who never finishes anything. Race day is twelve weeks away. An uplifting story about never giving up, even when the finish line is far away."],
  ["Canyon Road", 2013, 115, "FSK-16", "Thriller/Western", "canyon", 0.5, "A tour guide leads the wrong group of tourists into the slot canyons. The group is not there for the views. When the storm closes the road behind them, the guide realises she is their hostage. Wide landscapes, hard choices and a showdown nobody wants."],
  ["Carousel", 2017, 92, "FSK-6", "Comedy/Romance", "carnival-ferris-wheel", 0.7, "The funfair comes to town for one summer, and so does the operator's estranged son. He wants to sell the old rides. She wants to keep them. The town is about to choose a side. A warm and funny film about people who are a little lost."],
  ["Cold Harbour", 2020, 110, "FSK-16", "Crime", "trawlers", 0.3, "A customs officer starts asking why one trawler always comes back lighter. Nobody in the harbour wants to talk. The deeper she digs, the closer she gets to her own family. A dark and stylish crime story about loyalty, guilt and the price of the truth."],
  ["Crossing Lines", 2023, 98, "FSK-12", "Drama", "people-walking-city", 0.5, "Two friends spend their last day in Nice before one of them moves abroad. They walk the city from sunrise to midnight. Old jokes, old fights and a secret one of them has kept for years. A quiet, moving drama about the people we leave behind and the ones who wait for us."],
  ["Concerto for a Stranger", 2016, 113, "FSK-6", "Drama/Music", "violin", 0.5, "A violinist plays every night for a neighbour she has never seen. The neighbour answers with knocks on the wall. Slowly the music turns into a conversation neither of them can do without. A film that sounds as good as it looks."],
  ["City of Glass", 2024, 126, "FSK-12", "Science Fiction", "skyscraper", 0.5, "In a city of towers, a window cleaner sees something on the hundredth floor. Nobody believes him, and the company that owns the tower would rather he forgot. He climbs back up to find proof. A thoughtful science fiction story about what it means to be human."],
  ["Deep Water", 2018, 97, "FSK-12", "Thriller", "jellyfish", 0.5, "An aquarium keeper notices the jellyfish arranging themselves into words. Her colleagues think she is overworked. Then the messages start predicting things that come true. A tense thriller that keeps you guessing until the very last minute."],
  ["Desert Bloom", 2021, 103, "FSK-6", "Drama", "desert-dunes", 0.2, "A botanist waits a whole year in the desert for a rain that comes once a decade. Her only company is an old shepherd and his goats. When the rain finally comes, the desert changes in a single night. A quiet, moving drama about the people we leave behind and the ones who wait for us."],
  ["Dust and Diamonds", 2011, 119, "FSK-16", "Western", "horse-field", 0.3, "A horse trader and a gambler share a claim that turns out to be worth something. Neither of them trusts the other, and half the territory wants their claim. They will have to work together to keep it. Wide landscapes, hard choices and a showdown nobody wants."],
  ["Downpour", 2022, 91, "FSK-12", "Thriller", "crowd-street", 0.5, "A crowd waiting out the rain hides a pickpocket, a detective and a witness. For one hour under a shop awning, everyone is a suspect. The rain is not going to stop any time soon. A tense thriller that keeps you guessing until the very last minute."],
  ["Dear Neighbour", 2019, 95, "FSK-0", "Comedy", "cat", 0.4, "Two feuding neighbours share a cat without knowing it. Both of them feed it, name it and take it to the vet. When the cat goes missing, they finally have to talk. A feel-good comedy with a big heart and a lot of awkward moments."],
  ["Echoes", 2015, 108, "FSK-12", "Mystery", "foggy-forest", 0.3, "A sound recordist hears voices in the forest that are not on her tapes. The recordings come from a village that was flooded fifty years ago. Someone wants her to hear what happened there. A puzzle of a film, with every clue hiding in plain sight."],
  ["Edge of the Map", 2020, 116, "FSK-12", "Adventure", "glacier-alaska", 0.2, "A cartographer sets out to map the last glacier valley nobody has charted. Her team is small, the season is short and the ice is moving faster than anyone predicted. An honest and touching film about family, loss and hope."],
  ["Evening Train", 2012, 100, "FSK-6", "Romance", "train-station-people", 0.4, "The same two commuters, the same evening train, ten years of almost talking. One evening the train stops in the middle of nowhere. For two hours, they have nothing to do but finally talk. Romantic, bittersweet and beautifully told."],
  ["Fast Lane", 2019, 106, "FSK-12", "Action", "highway-night", 0.3, "A courier has one night to cross the city with a package nobody will name. Every gang in the city seems to want it. He has six hours, a scooter and a phone at three percent. An action film that hardly stops for breath."],
  ["Festival", 2023, 89, "FSK-12", "Comedy/Music", "festival-crowd", 0.5, "Four friends, one tent and a weekend festival that goes wrong from the first gate. They lose the car, the tickets and each other. By Sunday night, the friendship is the only thing left to save. A feel-good comedy with a big heart and a lot of awkward moments."],
  ["First Light", 2017, 102, "FSK-6", "Drama", "sunset-watcher", 0.3, "A man waits every morning on the beach for a boat that should have come back. Everyone in the village has stopped waiting except him. One summer, a stranger comes to wait with him. A drama told with great warmth and a lot of patience."],
  ["Flood Season", 2021, 117, "FSK-12", "Drama", "stormy-sea", 0.6, "A coastal village decides whether to stay when the sea comes in for good. Some want to build a wall, some want to leave, and some want to stay no matter what. A family drama about home. A drama told with great warmth and a lot of patience."],
  ["Frozen Line", 2014, 111, "FSK-16", "Thriller", "snowy-forest", 0.8, "Snowed in at a border post, three guards find tracks that lead only in one direction. Their radio is dead and the next post is two days away. Somewhere in the forest, someone is watching them. Gripping, clever and full of twists you will not see coming."],
  ["Grand Hotel Neon", 2022, 105, "FSK-12", "Comedy/Crime", "neon-street", 0.4, "A night porter in a tired hotel finds a fortune in room 404. The guests in the hotel all want a piece of it. So does the owner, and so do two very polite gangsters. A dark and stylish crime story about loyalty, guilt and the price of the truth."],
  ["Ghost Light", 2016, 98, "FSK-16", "Horror", "abandoned-building", 0.8, "A demolition crew spends one last night in an old mill that does not want to come down. Lights come on in empty rooms, and the machines start by themselves. By morning, not everyone will want to leave. A slow-burning horror film that gets under the skin and stays there."],
  ["Gravity of Stars", 2025, 131, "FSK-12", "Science Fiction", "starry-sky", 0.5, "An astronomer receives a signal that repeats her own childhood address. No one else can hear it. To find out who is calling, she has to go back to the house she left as a child. Big ideas, real feelings and a sky full of questions."],
  ["Half Past Midnight", 2018, 97, "FSK-16", "Thriller", "rain-window", 0.3, "A radio host takes a call that says a crime will happen at half past midnight. The police think it is a prank. She has three hours to find the caller, with the whole city listening. A tense thriller that keeps you guessing until the very last minute."],
  ["Headlights", 2015, 94, "FSK-12", "Crime", "highway-night", 0.8, "A truck driver picks up a hitchhiker who knows too much about her route. The night road is long and empty. Somewhere behind them, the same car has been following for an hour. A crime drama where nobody is completely innocent."],
  ["High Water", 2023, 109, "FSK-12", "Drama", "waterfall", 0.5, "A dam keeper has one night to decide whose valley floods. The storm will not wait. On one side lives his family, on the other the town he has served for thirty years. An honest and touching film about family, loss and hope."],
  ["Home Before Dark", 2020, 90, "FSK-6", "Family", "forest-road", 0.5, "Two children cycle home through the forest and take the long way by mistake. The forest is bigger than they thought. By nightfall they have met a hermit, a lost dog and their own courage. A warm adventure for the whole family, with laughs and a few tears."],
  ["Hush", 2019, 86, "FSK-16", "Horror", "owl", 0.5, "In a village where nobody may speak after dark, a girl hears someone answer. Her mother says she imagined it. The next night, the voice knows her name. Quiet, eerie and very hard to forget."],
  ["Hearts on the Shore", 2016, 104, "FSK-0", "Romance", "couple-beach-silhouette", 0.4, "A couple meets on the same beach every summer for forty years. They have never met anywhere else. This summer, one of them does not come. A tender love story about second chances and the moments we almost miss."],
  ["Iron Coast", 2013, 123, "FSK-16", "War/Drama", "harbor-night", 0.6, "A harbour town in 1944 hides a radio, a pilot and a secret. The village is full of soldiers, and anyone could be an informer. A young teacher decides to risk everything. A powerful drama about courage in the darkest of times."],
  ["Island Time", 2022, 92, "FSK-0", "Comedy", "people-beach", 0.5, "A workaholic is stranded on a holiday island where nobody owns a clock. His phone has no signal, his flight is delayed for a week, and the locals have opinions about his tie. A warm and funny film about people who are a little lost."],
  ["Jellyfish Summer", 2021, 95, "FSK-6", "Comedy/Drama", "jellyfish", 0.3, "A summer job at the aquarium turns into the strangest summer of a teenager's life. She has to feed the sharks, clean the tanks and keep a secret about the director. It is the best summer she will ever have. A warm and funny film about people who are a little lost."],
  ["Just One Song", 2018, 101, "FSK-0", "Music/Romance", "piano", 0.5, "A pianist in a hotel bar plays one song a night for a woman who never stays. Every night she leaves before the last note. One evening, he decides to follow her. A tender love story about second chances and the moments we almost miss."],
  ["King of the Savannah", 2017, 87, "FSK-6", "Family/Adventure", "lion", 0.4, "A young lion who would rather sleep has to defend the pride. His father is gone and the hyenas are getting bold. With a clumsy friend and a lot of luck, he has to grow up fast. A warm adventure for the whole family, with laughs and a few tears."],
  ["Keepers", 2024, 112, "FSK-12", "Mystery", "castle", 0.7, "The last caretakers of a mountain castle find a room that is not on any plan. Behind the hidden door is a diary from the last war. Some people in the valley would like it to stay hidden. A puzzle of a film, with every clue hiding in plain sight."],
  ["Lantern Festival", 2020, 99, "FSK-6", "Romance", "lanterns", 0.8, "Two rival lantern makers fall in love during the town's biggest festival. Their families have been rivals for three generations. This year, both of them are making the biggest lantern the town has ever seen. Romantic, bittersweet and beautifully told."],
  ["Long Way Down", 2016, 108, "FSK-16", "Thriller", "skyscraper", 0.2, "An elevator stops on the sixtieth floor with five strangers and one liar inside. The phones have no signal and the air is getting thin. One of the five knows exactly why the elevator stopped. Gripping, clever and full of twists you will not see coming."],
  ["Lost in the Fog", 2012, 93, "FSK-12", "Mystery", "bridge-fog", 0.8, "A ferry crosses the bay in thick fog and arrives with one passenger too many. Nobody saw him board. By the time the fog lifts, two of the passengers will be gone. A puzzle of a film, with every clue hiding in plain sight."],
  ["Last Orders", 2019, 97, "FSK-12", "Comedy/Drama", "audience", 0.5, "A pub band plays its farewell gig while the landlord plans to sell. The regulars plan to change his mind. They have one evening, a stage and a song nobody has rehearsed. A feel-good comedy with a big heart and a lot of awkward moments."],
  ["Lion Heart", 2022, 100, "FSK-6", "Family", "lion", 0.7, "A girl and an old circus lion run away together to find the savannah. Behind them come the circus owner, the police and a reporter. Ahead lies a whole continent. A warm adventure for the whole family, with laughs and a few tears."],
  ["Midnight Market", 2021, 102, "FSK-12", "Crime", "crowded-market", 0.8, "A food stall owner gets caught between two gangs who both like her soup. She just wants to sell noodles. Now both bosses want her to choose, and her stall is in the middle. A dark and stylish crime story about loyalty, guilt and the price of the truth."],
  ["Moonrise Lake", 2018, 106, "FSK-6", "Drama", "mountain-lake", 0.5, "A family spends one last summer in the lake house before it is sold. Three grown-up siblings, one tired mother and a lot of old arguments. By the end of August, everyone has to say goodbye. A drama told with great warmth and a lot of patience."],
  ["Morning Run", 2023, 89, "FSK-0", "Comedy/Sport", "marathon-runners", 0.8, "A lazy accountant signs up for a marathon to impress his daughter. He has never run more than a bus stop. His neighbour, a retired sprinter, decides to coach him. A feel-good comedy with a big heart and a lot of awkward moments."],
  ["Mountain Kings", 2015, 114, "FSK-12", "Adventure", "castle", 0.3, "Three climbers attempt the north face in the winter nobody else would. One of them has been there before and never talks about it. Halfway up, the weather turns. A quiet, moving drama about the people we leave behind and the ones who wait for us."],
  ["Murmur", 2020, 95, "FSK-16", "Horror", "foggy-forest", 0.8, "A family moves to the edge of a forest that whispers at night. At first it is only the children who hear it. Then the parents start to answer. Quiet, eerie and very hard to forget."],
  ["Music Box", 2017, 98, "FSK-6", "Drama/Music", "piano", 0.2, "A piano tuner finds a melody hidden in every instrument she repairs. The melodies come from a composer who died a century ago. Someone wants her to finish his last piece. Full of music, joy and the people who make it happen."],
  ["Mirage", 2024, 104, "FSK-12", "Thriller", "desert-dunes", 0.6, "A pilot who crash-landed in the desert keeps seeing the same town on the horizon. Each time he reaches it, it is gone again. His water runs low, and the town seems to be waiting for him. A tense thriller that keeps you guessing until the very last minute."],
  ["Neon Nights", 2019, 101, "FSK-16", "Crime", "neon-street", 0.8, "A taxi driver in a city that never sleeps has one fare that never pays. She takes him across the city again and again. He never says where he is going until it is too late. A dark and stylish crime story about loyalty, guilt and the price of the truth."],
  ["North of Nowhere", 2016, 118, "FSK-12", "Drama", "aurora", 0.8, "A postman delivers to the last houses before the Arctic and the people waiting there. Each letter he carries changes a life a little. One letter is addressed to him. A drama told with great warmth and a lot of patience."],
  ["Nightfall", 2022, 96, "FSK-16", "Horror", "owl", 0.7, "Every night at the same hour, the owls in the village fall silent. An ornithologist comes to find out why. What she finds in the forest is not a bird. Quiet, eerie and very hard to forget."],
  ["Northbound", 2013, 109, "FSK-12", "Drama", "old-train", 0.4, "A retired train driver takes his grandson on the old line before it closes. The journey takes three days and passes every station of his life. His grandson starts asking questions. A drama told with great warmth and a lot of patience."],
  ["One Last Wave", 2020, 97, "FSK-6", "Sport/Drama", "surfer", 0.7, "Three old friends meet for the swell of the decade. They have not surfed together in twenty years. Old rivalries come back faster than the swell. An uplifting story about never giving up, even when the finish line is far away."],
  ["Open Water", 2017, 92, "FSK-12", "Thriller", "whale", 0.5, "A whale-watching boat drifts too far out, and the radio is dead. The captain is injured, the passengers panic and the whales are circling. A teenage deckhand has to take charge. A tense thriller that keeps you guessing until the very last minute."],
  ["Orchestra", 2023, 123, "FSK-0", "Documentary/Music", "concert-crowd", 0.5, "A year with a youth orchestra on its way to its first big hall. Sixty teenagers, one tired conductor and a concert that could change their lives. A documentary full of music and nerves. Warm, curious and full of moments you will want to share."],
  ["Paper Planes", 2018, 91, "FSK-0", "Family", "bicycle-street", 0.5, "A boy sends paper planes from his window and gets an answer. The answers come from a girl across the street who is not allowed to go outside. Their friendship grows one plane at a time. A story for everyone who has ever believed in a little magic."],
  ["Pale Blue", 2021, 110, "FSK-12", "Science Fiction", "starry-sky", 0.8, "Six months on a station at the edge of the solar system, and one message from home. The message is a single word. To understand it, the crew must decide whether to turn back. A thoughtful science fiction story about what it means to be human."],
  ["Pilgrims", 2015, 120, "FSK-12", "Drama", "canyon", 0.7, "Strangers walking an old pilgrim route through the canyons find out why the others came. There is a widow, a banker, a monk and a teenager with a stolen car. The canyon has a way of making people honest. A quiet, moving drama about the people we leave behind and the ones who wait for us."],
  ["Quiet Streets", 2020, 94, "FSK-12", "Drama", "rain-window", 0.8, "A city in lockdown, seen from one window by a woman who starts to notice everything. She watches a neighbour who never leaves, a boy who waits for a letter and a man who is lying. Then she sees something she should not. A drama told with great warmth and a lot of patience."],
  ["Rainmaker", 2014, 107, "FSK-12", "Drama", "crowd-street", 0.8, "A weather forecaster who is always wrong is suddenly always right. Overnight he becomes the most famous man in the country. Then he predicts a storm nobody wants to believe. A quiet, moving drama about the people we leave behind and the ones who wait for us."],
  ["Red Line", 2022, 103, "FSK-16", "Action", "train-station-people", 0.7, "A subway train is taken over between two stations. Two hundred passengers are trapped in the tunnel. A transit cop on her day off is the only one who can reach them. Fast, loud and full of surprises, with a hero who never quite has a plan."],
  ["River Song", 2019, 99, "FSK-0", "Family", "waterfall", 0.3, "Three children follow the river to find where it starts. On the way they meet beavers, fishermen and a very grumpy heron. Every bend of the river brings a new adventure. A story for everyone who has ever believed in a little magic."],
  ["Runaway Summer", 2016, 95, "FSK-6", "Comedy", "people-beach", 0.8, "Two sisters run away to the seaside, followed by their entire family. Aunts, cousins and a grandmother with a camper van are all on the road. Nobody will be going home the same. A feel-good comedy with a big heart and a lot of awkward moments."],
  ["Saltwater", 2018, 112, "FSK-12", "Drama", "whale", 0.3, "A marine biologist returns to the island where her mother disappeared at sea. The islanders say the sea took her. The letters she left behind say something very different. An honest and touching film about family, loss and hope."],
  ["Second Act", 2021, 98, "FSK-0", "Comedy", "audience", 0.7, "A retired actor joins an amateur theatre that badly needs him. The theatre is broke, the cast is hopeless and opening night is in six weeks. He has never had more fun. A warm and funny film about people who are a little lost."],
  ["Silent Peaks", 2014, 115, "FSK-12", "Adventure", "mountain-lake", 0.8, "A mountain guide leads a group who all lied about why they came. Halfway up the mountain, the weather closes in. The truth starts to come out one by one. An honest and touching film about family, loss and hope."],
  ["Skyline", 2023, 106, "FSK-12", "Action", "skyscraper", 0.85, "A window cleaner becomes the only witness to a heist in a tower. The thieves are on the floor below him and the police are on the ground. He has a bucket, a rope and a lot of courage. An action film that hardly stops for breath."],
  ["Snowbound", 2012, 99, "FSK-12", "Thriller", "dog-snow", 0.2, "A sled dog and its owner are cut off by the storm of the century. The cabin is miles away and the food is running out. The dog seems to know a way the map does not show. A tense thriller that keeps you guessing until the very last minute."],
  ["Strangers on a Shore", 2017, 101, "FSK-6", "Romance", "couple-beach-silhouette", 0.7, "Two people who came to the coast to be alone keep meeting. She is writing a book. He is hiding from his family. The coast is very small. A tender love story about second chances and the moments we almost miss."],
  ["The Typewriter", 2016, 97, "FSK-6", "Drama", "vintage-typewriter", 0.5, "A writer buys an old typewriter that finishes her sentences. At first it helps. Then the sentences start to describe things that have not happened yet. An honest and touching film about family, loss and hope."],
  ["Tidewater", 2019, 108, "FSK-12", "Drama", "pier-sunset", 0.3, "A fisherman's widow keeps the pier open for one more season. The council wants to sell it, and her son wants her to move. She has one season to prove the pier still matters. A drama told with great warmth and a lot of patience."],
  ["Two Wheels", 2022, 89, "FSK-0", "Comedy", "bicycle-street", 0.7, "A stolen bicycle passes through ten owners in one week. Each owner has a reason to need it. In the end, it finds its way back to the girl who lost it. A warm and funny film about people who are a little lost."],
  ["Thunder Road", 2015, 104, "FSK-16", "Action", "highway-night", 0.5, "A getaway driver's last job goes wrong at the first traffic light. Now he has a bag of money, a passenger he does not know and every police car in the city behind him. An action film that hardly stops for breath."],
  ["The Tower", 2024, 117, "FSK-12", "Thriller", "abandoned-building", 0.4, "A group of urban explorers spend a night in the tower that was never finished. The elevator works, which it should not. Floor by floor, the building starts to show them its history. Gripping, clever and full of twists you will not see coming."],
  ["Upstream", 2021, 93, "FSK-6", "Adventure", "waterfall", 0.7, "A canoe trip up the river turns into a search for a missing guide. The river gets wilder with every mile. The group finds his camp, but not him. An honest and touching film about family, loss and hope."],
  ["Velvet Night", 2018, 100, "FSK-16", "Crime/Music", "concert-crowd", 0.3, "A club singer witnesses a deal she was never supposed to see. Now both the police and the mob want to know what she saw. She has a gig to play tonight. A crime drama where nobody is completely innocent."],
  ["Volcano Island", 2023, 106, "FSK-12", "Adventure", "volcano", 0.7, "A film crew lands on an island just as the volcano wakes up. The boats have left and the radio is down. The director keeps filming. A drama told with great warmth and a lot of patience."],
  ["Vanguard", 2016, 134, "FSK-12", "Action/Superhero", "skyscraper", 0.6, "A bridge engineer discovers she can bend steel with her mind, the day the city needs it. She never wanted to be a hero. But when the bridge starts to fall, she is the only one who can hold it together. A superhero story with heart, humour and a lot of falling steel."],
  ["Vanguard: Fallout", 2019, 141, "FSK-12", "Action/Superhero", "highway-night", 0.15, "The city has a hero and a new enemy who learned from her mistakes. He knows her weaknesses and her secrets. To stop him, the Vanguard must work as a team for the first time. Big action, a reluctant hero and a city that has never needed her more."],
  ["Vanguard: Last Stand", 2023, 152, "FSK-12", "Action/Superhero", "abandoned-building", 0.2, "The last of the Vanguard face the machine that built them. The machine wants to finish what it started. They have one chance, and not all of them will come back. Big action, a reluctant hero and a city that has never needed her more."],
  ["Whale Song", 2019, 88, "FSK-0", "Documentary", "whale", 0.6, "A year following one humpback family across the North Atlantic. We follow a mother and her calf from Caribbean waters to the icy north. A journey of thousands of miles, told in their own songs. Warm, curious and full of moments you will want to share."],
  ["Wild Horses", 2016, 109, "FSK-12", "Western", "horse-field", 0.7, "A rancher's daughter sets free the herd her father meant to sell. Her father is furious and the buyers are angry. She has three days to get the horses across the mountains. A classic western about dust, honour and the long road home."],
  ["Wanderers", 2022, 113, "FSK-12", "Drama", "people-walking-city", 0.6, "Two drifters walk the length of the coast, one town a day. They sleep in barns and work for food. Every town has someone who wants them to stay. A quiet, moving drama about the people we leave behind and the ones who wait for us."],
  ["White Out", 2014, 98, "FSK-16", "Thriller", "glacier-alaska", 0.8, "A research team on the ice loses contact with base, and then with each other. The storm will not let up. One by one, they discover that someone on the team is not who they say. Gripping, clever and full of twists you will not see coming."],
  ["Where the Road Ends", 2021, 104, "FSK-12", "Drama", "forest-road", 0.6, "A woman drives to the end of a forest road to deliver a letter thirty years late. The letter was written by her mother. The man it was meant for still lives in the last house in the forest. An honest and touching film about family, loss and hope."],
  ["Year of the Fox", 2020, 95, "FSK-6", "Family", "fox-meadow", 0.5, "A girl spends a year watching a fox family from her bedroom window. Spring, summer, autumn and winter pass outside the window. She learns more about life than in any classroom. A story for everyone who has ever believed in a little magic."],
  ["Zero Hour", 2017, 99, "FSK-16", "Action/Thriller", "neon-street", 0.2, "A bomb disposal expert has until midnight and a city that will not stop. The bombs are hidden all over the city, and the man who placed them wants to talk. Only to her. Fast, loud and full of surprises, with a hero who never quite has a plan."],
]

