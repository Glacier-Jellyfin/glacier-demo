# The demo library. Every title, person and studio here is made up; the
# images are the ids from sources.toml.
#
# A title's files use a video preset and a track template from tracks.toml.
# "focus" is where a portrait crop of the poster image centres, from 0 (left)
# to 1 (right). "style" picks the poster font: serif, display, sans or soft.
# "layout" fixes where the title and tagline go (bottom, top, center,
# bottom-tagline-below, top-tagline-below, bottom-tagline-top); without it
# the title picks one, and most come out without a tagline. "align" sets
# the title left, right or center; size and alignment otherwise vary too.
# "plain_poster" uses the poster image as it is, for real posters that have
# their own lettering. Titles without "rating" are unrated.
# "collection" puts a film or series into one collection, or several as a list.

